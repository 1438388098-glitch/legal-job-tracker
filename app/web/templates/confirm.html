{% extends "base.html" %}
{% block content %}
<div class="card">
 <h2 style="margin-top:0">确认 / 修改岗位信息</h2>
 <p class="muted">自动提取的字段可能有误，请核对后保存。保存后岗位进入正式列表。</p>
 <form method="post" action="/jobs/{{ job['id'] }}/confirm" style="display:grid;gap:10px;max-width:640px">
  <label>标题<br><input name="title" value="{{ job['title'] }}" style="width:100%"></label>
  <label>城市
   <select name="city">
    <option value="">不限</option>
    {% for c in cities %}
    <option value="{{ c }}" {% if job['city']==c %}selected{% endif %}>{{ c }}</option>
    {% endfor %}
   </select></label>
  <label>截止日期（如公告未注明可留空）<br><input name="deadline" value="{{ job['deadline'] or '' }}" placeholder="YYYY-MM-DD"></label>
  <label>岗位类型
   <select name="job_type">
    {% for val, label in job_types %}
    <option value="{{ val }}" {% if job['job_type']==val %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
   </select></label>
  <label>备注<br><textarea name="notes" rows="3" style="width:100%">{{ job['notes'] or '' }}</textarea></label>
  <button class="primary" type="submit">✔ 确认入库</button>
 </form>
</div>
{% endblock %}
