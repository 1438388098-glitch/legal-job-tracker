<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}法学招聘信息中台{% endblock %}</title>
{# 主题必须在样式表之前写死，否则首帧会闪一下默认配色 #}
<script>try{var t=localStorage.getItem("theme")||"auto";var d=t==="dark"||(t==="auto"&&window.matchMedia("(prefers-color-scheme: dark)").matches);var e=document.documentElement;e.dataset.theme=d?"dark":"light";e.dataset.themeIntent=t;}catch(err){document.documentElement.dataset.theme="light";document.documentElement.dataset.themeIntent="auto";}</script>
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
<script src="/static/app.js?v={{ asset_v }}" defer></script>
</head>
<body>
{% set path = request.url.path %}
<header class="top">
  <a class="brand" href="/">法学招聘中台</a>
  <a class="nav-a" href="/" {% if path == '/' %}aria-current="page"{% endif %}>岗位</a>
  <a class="nav-a" href="/board" {% if path == '/board' %}aria-current="page"{% endif %}>投递</a>
  <a class="nav-a" href="/recommend" {% if path == '/recommend' %}aria-current="page"{% endif %}>推荐</a>
  <a class="nav-a" href="/paste" {% if path == '/paste' %}aria-current="page"{% endif %}>粘贴箱</a>
  <a class="nav-a" href="/health" {% if path == '/health' %}aria-current="page"{% endif %}>源健康</a>
  <a class="nav-a" href="/profile" {% if path == '/profile' %}aria-current="page"{% endif %}>画像</a>
  <a class="nav-a" href="/settings" {% if path == '/settings' %}aria-current="page"{% endif %}>设置</a>
  <span class="top-right">
    <a class="nav-a" href="/export.xlsx">导出</a>
    <button class="icon theme-btn" type="button" data-theme-toggle
            title="主题：跟随系统（点击切换）" aria-label="主题：跟随系统（点击切换）">
      <svg class="i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8.2"></circle>
        <path d="M12 3.8v16.4a8.2 8.2 0 0 0 0-16.4z" fill="currentColor" stroke="none"></path>
      </svg>
      <svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"></path>
      </svg>
      <svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"></path>
      </svg>
    </button>
  </span>
</header>
{% if urgent and urgent > 0 %}
<div class="alert">
  <span><b>{{ urgent }}</b> 个岗位 3 天内截止</span>
  <a href="/?urgent=3">只看这些</a>
</div>
{% endif %}
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
