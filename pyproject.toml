[project]
name = "zhaopin-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "apscheduler>=3.10",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
toast = ["win11toast>=0.35"]

[tool.pytest.ini_options]
testpaths = ["tests"]
